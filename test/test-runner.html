<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circadian Algorithm Tests</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1419;
      color: #e0e0e0;
    }
    h1 {
      color: #60a5fa;
    }
    pre {
      background: #1a1f2e;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .pass {
      color: #4ade80;
    }
    .fail {
      color: #f87171;
    }
    .summary {
      margin-top: 2rem;
      padding: 1rem;
      background: #1a1f2e;
      border-radius: 6px;
      border-left: 4px solid #60a5fa;
    }
    .summary.all-pass {
      border-left-color: #4ade80;
    }
    .summary.has-fail {
      border-left-color: #f87171;
    }
  </style>
</head>
<body>
  <h1>Circadian Algorithm Test Suite</h1>
  <pre id="output"></pre>
  <div id="summary" class="summary"></div>
  
  <script src="../js/circadian-algorithm.js"></script>
  <script>
    // Redirect console to output element
    const output = document.getElementById('output');
    const summaryEl = document.getElementById('summary');
    const originalLog = console.log;
    const originalError = console.error;
    
    console.log = function(...args) {
      const line = args.join(' ');
      const span = document.createElement('span');
      if (line.includes('✓')) {
        span.className = 'pass';
      } else if (line.includes('✗')) {
        span.className = 'fail';
      }
      span.textContent = line + '\n';
      output.appendChild(span);
      originalLog.apply(console, args);
    };
    
    console.error = function(...args) {
      const line = args.join(' ');
      const span = document.createElement('span');
      span.className = 'fail';
      span.textContent = line + '\n';
      output.appendChild(span);
      originalError.apply(console, args);
    };
  </script>
  <script src="./circadian-algorithm.test.js"></script>
  <script>
    // Update summary based on results
    const text = output.textContent;
    const passMatch = text.match(/✓ Pass: (\d+)/);
    const failMatch = text.match(/✗ Fail: (\d+)/);
    const totalMatch = text.match(/Total: (\d+)/);
    
    if (passMatch && failMatch && totalMatch) {
      const passCount = parseInt(passMatch[1]);
      const failCount = parseInt(failMatch[1]);
      const totalCount = parseInt(totalMatch[1]);
      
      summaryEl.innerHTML = `
        <strong>Test Results:</strong><br>
        Total: ${totalCount} | 
        <span class="pass">Pass: ${passCount}</span> | 
        <span class="fail">Fail: ${failCount}</span>
      `;
      
      if (failCount === 0) {
        summaryEl.classList.add('all-pass');
        summaryEl.innerHTML += '<br><br>✓ All tests passed!';
      } else {
        summaryEl.classList.add('has-fail');
      }
    }
  </script>
</body>
</html>
