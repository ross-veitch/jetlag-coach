<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jet Lag Coach" />
  <meta name="description" content="Ross Veitch jet-lag coach — continuous timeline for SIN→DXB→MIA→DXB→SIN, Nov 2026. Not medical advice." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Jet Lag Coach</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-text">
      <h1>Jet Lag Coach</h1>
      <p class="sub">SIN → DXB → MIA → DXB → SIN · 11–29 Nov 2026</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-icon" id="btn-notif" aria-label="Reminders" aria-pressed="false" title="Enable local reminders">
        <span class="dot off" aria-hidden="true"></span>
        🔔
      </button>
      <button type="button" class="btn btn-icon" id="btn-info" aria-label="About and strategy">ⓘ</button>
    </div>
  </header>

  <section class="up-next" id="up-next" aria-label="Up next">
    <div class="up-next-label">Up next</div>
    <ol class="up-next-list" id="up-next-list"></ol>
  </section>

  <div class="timeline-scroll" id="timeline-scroll">
    <div class="out-of-window" id="out-banner" hidden></div>
    <div class="col-heads" id="col-heads">
      <label class="tz-head" for="tz-left">
        <span class="tz-abbr" id="lhs-head">SGT</span>
        <span class="tz-chev" aria-hidden="true">▾</span>
        <select id="tz-left" aria-label="Left timezone"></select>
      </label>
      <div class="mid" aria-hidden="true">Timeline</div>
      <label class="tz-head" for="tz-right">
        <span class="tz-abbr" id="rhs-head">Auto</span>
        <span class="tz-chev" aria-hidden="true">▾</span>
        <select id="tz-right" aria-label="Right timezone"></select>
      </label>
    </div>
    <div class="timeline" id="timeline">
      <div class="timeline-body" id="timeline-body">
        <div class="axis-col lhs" id="axis-lhs" aria-label="Left timezone hours"></div>
        <div class="spine" id="spine" aria-label="Action timeline"></div>
        <div class="axis-col rhs" id="axis-rhs" aria-label="Right timezone hours"></div>
      </div>
      <div class="now-line" id="now-line" hidden>
        <span class="now-badge" id="now-badge">NOW</span>
      </div>
    </div>
  </div>

  <button type="button" class="fab-now" id="fab-now" aria-label="Jump to now">⬤ Now</button>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
    <button type="button" class="btn" id="sheet-close" style="width:100%;margin-top:12px">Close</button>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true">
    <div class="close-row">
      <button type="button" class="btn" id="panel-close">Close</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="./js/trip-data.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
