<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jet Lag Coach" />
  <meta name="description" content="Ross Veitch jet-lag coach — continuous timeline for SIN→DXB→MIA→DXB→SIN, Nov 2026. Not medical advice." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Jet Lag Coach</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-text">
      <h1>Jet Lag Coach</h1>
      <p class="sub">SIN → DXB → MIA → DXB → SIN · 11–29 Nov 2026</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-icon" id="btn-notif" aria-label="Reminders" aria-pressed="false" title="Enable local reminders">
        <span class="dot off" aria-hidden="true"></span>
        🔔
      </button>
      <button type="button" class="btn btn-icon" id="btn-info" aria-label="About and strategy">ⓘ</button>
    </div>
  </header>

  <div class="tz-bar" id="tz-bar">
    <label class="tz-pick">
      <span class="tz-role">Left</span>
      <select id="tz-left" aria-label="Left timezone"></select>
    </label>
    <label class="tz-pick">
      <span class="tz-role">Right</span>
      <select id="tz-right" aria-label="Right timezone"></select>
    </label>
  </div>

  <div class="legend-bar" id="legend" aria-label="Legend"></div>

  <div class="timeline-scroll" id="timeline-scroll">
    <div class="out-of-window" id="out-banner" hidden></div>
    <div class="col-heads" id="col-heads">
      <div class="head-lhs" id="lhs-head">SGT</div>
      <div class="mid">
        <span class="lane-key"><i class="lk sleep"></i><span class="lane-key-text">Sleep</span></span>
        <span class="lane-key"><i class="lk light"></i><span class="lane-key-text">Light</span></span>
        <span class="lane-key"><i class="lk marks"></i><span class="lane-key-text">Marks</span></span>
      </div>
      <div class="head-rhs" id="rhs-head">Auto</div>
    </div>
    <div class="timeline" id="timeline">
      <div class="timeline-body" id="timeline-body">
        <div class="axis-col lhs" id="axis-lhs" aria-label="Left timezone"></div>
        <div class="spine" id="spine" aria-label="Action timeline">
          <div class="lane-guides" aria-hidden="true">
            <div class="lg sleep"></div>
            <div class="lg light"></div>
            <div class="lg marks"></div>
          </div>
        </div>
        <div class="axis-col rhs" id="axis-rhs" aria-label="Right timezone"></div>
      </div>
      <div class="now-line" id="now-line" hidden>
        <span class="now-badge" id="now-badge">NOW</span>
      </div>
    </div>
  </div>

  <button type="button" class="fab-now" id="fab-now" aria-label="Jump to now">⬤ Now</button>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
    <button type="button" class="btn" id="sheet-close" style="width:100%;margin-top:12px">Close</button>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true">
    <div class="close-row">
      <button type="button" class="btn" id="panel-close">Close</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="./js/trip-data.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
